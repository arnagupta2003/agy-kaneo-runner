name: kaneo-worker
description: Polls Kaneo for Investigate/Approved cards and runs Antigravity CLI (agy) single-flight.
schedule: "* * * * *"
max_active_runs: 1
timeout_sec: 1800
dotenv:
  - /app/.env
env:
  - KANEO_URL: ${KANEO_URL}
  - KANEO_API_KEY: ${KANEO_API_KEY}
  - KANEO_PROJECT_ID: ${KANEO_PROJECT_ID}
  - COL_INVESTIGATE: ${COL_INVESTIGATE}
  - COL_INVESTIGATING: ${COL_INVESTIGATING}
  - COL_READY_FOR_APPROVAL: ${COL_READY_FOR_APPROVAL}
  - COL_APPROVED: ${COL_APPROVED}
  - COL_IN_PROGRESS: ${COL_IN_PROGRESS}
  - COL_IN_REVIEW: ${COL_IN_REVIEW}
  - COL_BLOCKED: ${COL_BLOCKED}
  - GEMINI_API_KEY: ${GEMINI_API_KEY}
  - AGY_MODEL: ${AGY_MODEL}
  - AGY_EFFORT: ${AGY_EFFORT}
  - AGY_INVESTIGATE_TIMEOUT: ${AGY_INVESTIGATE_TIMEOUT}
  - AGY_EXECUTE_TIMEOUT: ${AGY_EXECUTE_TIMEOUT}

handler_on:
  failure:
    command: python3 /app/worker.py fail

steps:
  - name: reap-orphans
    description: Move any cards stranded in Investigating/In Progress after a hard crash to Blocked.
    command: python3 /app/worker.py reap

  - name: process-next-task
    description: Pick the next Approved or Investigate card and run agy.
    depends:
      - reap-orphans
    command: python3 /app/worker.py run
